<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex"><title>Officer Resource Admin | MSJ DECA</title>
  <link rel="stylesheet" href="../style.css"><script src="../script.js" defer></script><script type="module" src="../admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span><span>MSJ DECA</span></a><button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-label="Open navigation">☰</button><nav class="site-nav" data-site-nav><ul class="nav-list"><li><a class="nav-link" href="../index.html">Home</a></li><li><a class="nav-link" href="resources.html">Resources</a></li><li><a class="nav-link" href="quiz.html">Event Quiz</a></li></ul></nav></div></header>
  <main id="main-content">
    <section class="page-hero"><div class="container"><p class="eyebrow">Officer access only</p><h1>Resource admin.</h1><p class="lede">Publish and maintain resource listings. Files remain in the chapter’s school-restricted Google Drive.</p></div></section>
    <section class="section"><div class="container">
      <div class="account-bar"><div><div class="footer-note">Signed in as</div><div class="account-email" data-account-email></div></div><button class="button button-small" type="button" data-logout>Sign out</button></div>
      <div class="notice" data-admin-gate>Checking officer permissions…</div>
      <div class="admin-layout" data-admin-workspace hidden>
        <section class="admin-panel">
          <h2 data-form-title style="font-size:2.2rem;">Add a resource</h2>
          <form data-resource-form>
            <label for="title">Resource title</label><input id="title" name="title" required maxlength="100">
            <label for="category" style="margin-top:1rem;">Category</label><input id="category" name="category" required maxlength="50" placeholder="Example: Role-plays">
            <label for="description" style="margin-top:1rem;">Description</label><textarea id="description" name="description" required maxlength="500"></textarea>
            <label for="driveUrl" style="margin-top:1rem;">School-restricted Google Drive link</label><input id="driveUrl" name="driveUrl" type="url" required placeholder="https://drive.google.com/…">
            <div class="form-actions"><button class="button button-primary" type="submit" data-submit-resource>Publish resource</button><button class="button" type="button" data-cancel-edit hidden>Cancel edit</button></div>
            <p class="auth-status" data-admin-message aria-live="polite"></p>
          </form>
        </section>
        <section class="admin-panel"><h2 style="font-size:2.2rem;">Published resources</h2><div data-admin-resource-list></div></section>
      </div>
    </section>
  </main>
  <script type="module" src="../auth.js"></script>
</body>
</html>
